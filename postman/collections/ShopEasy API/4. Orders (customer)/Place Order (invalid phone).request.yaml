$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test",
      "phone": "123",
      "address": "x",
      "city": "y",
      "pin": "751001"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
