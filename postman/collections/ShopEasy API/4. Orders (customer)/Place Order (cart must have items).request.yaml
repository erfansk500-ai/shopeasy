$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "phone": "9876543210",
      "address": "12 Main Road",
      "city": "Bhubaneswar",
      "pin": "751001"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
