$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "test@example.com",
      "password": "test123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
