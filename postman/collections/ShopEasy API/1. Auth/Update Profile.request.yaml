$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "phone": "9876543210",
      "address": "Bhubaneswar"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
