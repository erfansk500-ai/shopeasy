<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">ShopEasy</a>
    <nav>
      <a href="/login.html" id="loginLink">Login</a>
      <a href="/orders.html">My Orders</a>
      <a href="/cart.html">Cart (<span id="cartCount">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <h2>Checkout</h2>
    <div class="checkout-layout">
      <form id="checkoutForm" class="auth-box wide">
        <label>Full Name</label>
        <input type="text" id="name" required>
        <label>Phone (10 digits)</label>
        <input type="text" id="phone" required maxlength="10" pattern="\d{10}">
        <label>Address</label>
        <input type="text" id="address" required>
        <label>City</label>
        <input type="text" id="city" required>
        <label>PIN Code (6 digits)</label>
        <input type="text" id="pin" required maxlength="6" pattern="\d{6}">
        <p><b>Payment:</b> Cash on Delivery</p>
        <button type="submit">Place Order</button>
        <p id="msg" class="form-msg"></p>
      </form>

      <div class="summary" id="summary"></div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
