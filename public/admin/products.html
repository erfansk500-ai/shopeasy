<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/admin/dashboard.html" class="logo">ShopEasy Admin</a>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="#" id="loginLink">Logout</a>
    </nav>
  </header>

  <main class="container">
    <div class="row-between">
      <h2>Products</h2>
      <button class="btn" id="addBtn">+ Add Product</button>
    </div>
    <p id="message"></p>
    <div id="tableBox"></div>

    <form id="productForm" class="auth-box wide admin-form" style="display:none">
      <h3 id="formTitle">Add Product</h3>
      <input type="hidden" id="pid">
      <label>Name</label>
      <input type="text" id="pname" required>
      <label>Category</label>
      <select id="pcategory" required></select>
      <label>Description</label>
      <input type="text" id="pdesc">
      <label>Price (₹)</label>
      <input type="number" id="pprice" min="0" step="0.01" required>
      <label>Stock</label>
      <input type="number" id="pstock" min="0" step="1" required>
      <label>Image URL</label>
      <input type="text" id="pimage">
      <label><input type="checkbox" id="pactive" checked style="width:auto"> Active (visible to customers)</label>
      <button type="submit">Save</button>
      <button type="button" id="cancelBtn" class="secondary">Cancel</button>
      <p id="formMsg" class="form-msg"></p>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
